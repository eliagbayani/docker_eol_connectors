# H6: real visitor IPs. Visitors → Cloudflare → this container, either straight to 160.111.248.39:443
# (from deployment day) or, while it still exists, through the old front device 160.111.248.42
# (connects from 10.252.248.42) to port 8080. Without this, every access-log line shows Cloudflare's or .42's address.
# With it, %h in the log (and REMOTE_ADDR in PHP) is the visitor's IP, taken from X-Forwarded-For.
# The header is only believed on requests from Cloudflare's ranges (cloudflare-ips.txt) or REMOTEIP_PROXY
# (set in docker-compose.yml, default 10.252.248.42); a visitor can't fake it by sending their own header
# straight to the server.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${REMOTEIP_PROXY}
RemoteIPTrustedProxyList /etc/apache2/conf-available/cloudflare-ips.txt
