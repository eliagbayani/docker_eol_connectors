# H6: visitors → Cloudflare → 160.111.248.42 (ends HTTPS, connects from 10.252.248.42) → this container.
# Without this, every access-log line shows 10.252.248.42. With it, %h in the log (and REMOTE_ADDR in PHP)
# is the visitor's IP, taken from X-Forwarded-For.
# The header is only believed on requests that come from REMOTEIP_PROXY (set in docker-compose.yml,
# default 10.252.248.42); a visitor can't fake it by sending their own header straight to the server.
# Cloudflare's own addresses in the header (if .42 appends them) are skipped too, so the visitor's IP is left.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${REMOTEIP_PROXY}
RemoteIPTrustedProxyList /etc/apache2/conf-available/cloudflare-ips.txt
