; Production overrides (H1). Loaded from conf.d after php.ini, only when ENVIRONMENT_FROM_COMPOSE=production.
; display_errors is only the default: a page can still call ini_set('display_errors', true) to show its errors.
display_errors = Off
display_startup_errors = Off
log_errors = On
; errors go to the Apache error log = container stderr -> docker compose logs web
error_reporting = E_ALL & ~E_DEPRECATED
expose_php = Off
zend.assertions = -1
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
; Enable only once TLS is in front (H6); over plain HTTP the browser would drop the session cookie.
; session.cookie_secure = 1
