<IfModule ssl_module>
# HTTPS for editors.eol.org. Cloudflare connects straight to eol-archive (160.111.248.39:443, WEB_HTTPS_PORTS
# in .env) and HTTPS ends here; the old front device 160.111.248.42 is being retired.
# Same webroot, aliases and blocked paths as the plain-HTTP site (000-default.conf): those are set in apache2.conf.
# Logs: the same access.log / error.log (set in apache2.conf for both sites).
<VirtualHost *:443>
	ServerName editors.eol.org
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	SSLEngine on
	SSLProtocol -all +TLSv1.2 +TLSv1.3
	# Made by https-cert.sh at start-up if missing (self-signed). To use a real one (e.g. a Cloudflare Origin
	# certificate), replace the 2 files in HTTPS_CERTS_PATH (.env) and restart web; no rebuild needed.
	SSLCertificateFile    /etc/apache2/certs/editors.eol.org.crt
	SSLCertificateKeyFile /etc/apache2/certs/editors.eol.org.key

	# Only Cloudflare may connect on 443, so nobody can skip Cloudflare by going to the public IP.
	# The test is on the connection's address (CONN_REMOTE_ADDR), not the visitor's IP that mod_remoteip
	# puts in the log. HTTPS_ALSO_ALLOW (.env) adds addresses for tests from the server and the internal network.
	# AuthMerging And: the blocked paths in apache2.conf (config/, *.yml, .ht*, ...) stay blocked here too.
	<Location "/">
		AuthMerging And
		Include /etc/apache2/https-allow.inc
	</Location>
</VirtualHost>
</IfModule>
