services:
  # =================== MySQL service ===================
  db:
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: eol_${MY_ENVIRONMENT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    build:
      context: ./mysql
      args:
        MRP_FROM_COMPOSE: ${MYSQL_ROOT_PASSWORD}
        ENVIRONMENT_FROM_COMPOSE: ${MY_ENVIRONMENT}
      dockerfile: Dockerfile
    # image: eagbayani/db-service:1.0 #for Docker Hub
    # image: ${REGISTRY}/${REGISTRY_DB_IMAGE}:${REGISTRY_DB_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      # 'localhost' or 'db' works just the same
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ${MYSQL_DATA_DIR}:/var/lib/mysql
    ports:
      - ${MYSQL_PORTS} # 4001:3306

  # =================== Apache and PHP service ===================
  web:
    build:
      context: ./apache-php
      args:
        GNPARSER_VERSION: ${GNPARSER_VERSION:-1.15.0}
        GNPARSER_URL: ${GNPARSER_URL:-}
        ENVIRONMENT_FROM_COMPOSE: ${MY_ENVIRONMENT}
      dockerfile: Dockerfile
    # image: php:8.2-apache
    # image: eagbayani/web-service:1.0 #for Docker Hub
    # image: ${REGISTRY}/${REGISTRY_WEB_IMAGE}:${REGISTRY_WEB_TAG} #works OK
    platform: linux/amd64
    restart: unless-stopped #old value: always
    depends_on:
      db:
        condition: service_healthy
    # Below was working. I needed it if I want to restart Apache in terminal mode in Docker.
    environment:
      APACHE_RUN_DIR: /etc/apache2
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data
      APACHE_PID_FILE: /var/run/apache2/apache2.pid
      APACHE_LOG_DIR: /var/log/apache2
      TARGET_PATH: ${WEBROOT_PATH} #used only in entrypoint sh
      MY_ENV: ${MY_ENVIRONMENT} #used only in entrypoint sh
    volumes:
      - ${WEBROOT_PATH}:/var/www/html
      - ${APACHE_LOGS}:/var/log/apache2
      - ${EXTRA_PATH}:/extra
    # command: ${PWD}/apache-php/docker-entrypoint_${MY_ENVIRONMENT}.sh #works OK
    # entrypoint: ${PWD}/apache-php/docker-entrypoint.sh #works OK as well

    command: /usr/local/bin/docker-entrypoint_${MY_ENVIRONMENT}.sh

    ports:
      - ${WEB_PORTS} # 81:80
    links:
      - db
    # Sol'n so u can curl local webserver from host.
    # Use 'host.docker.internal' instead of 'localhost' in PHP script.
    # https://medium.com/@gladevise/accessing-the-hosts-localhost-from-inside-a-docker-container-c5935e275953
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =================== Jenkins service ===================
  jenkins:
    env_file: ./.env
    build:
      args:
        JENKINS_HOME_FROM_COMPOSE: ${PATH_JENKINS_HOME}
        JENKINS_TMP_FROM_COMPOSE: ${PATH_JENKINS_TMP}
        PYTHON_APP_DIR_FROM_COMPOSE: ${PYTHON_APP}
      context: ./jenkins
      dockerfile: Dockerfile
    # image: jenkins/jenkins:2.538-jdk21
    # image: eagbayani/jenkins-service:1.0 #for Docker Hub
    # image: ${REGISTRY}/${REGISTRY_JENKINS_IMAGE}:${REGISTRY_JENKINS_TAG}
    restart: unless-stopped #old value: on-failure

    volumes:
      # Host path var must NOT be named JENKINS_HOME — env_file would override
      # the in-container path Jenkins expects (/var/jenkins_home).
      - ${PATH_JENKINS_HOME}:/var/jenkins_home:rw
      # -> works OK; better implementation

      - ${WEBROOT_PATH}:/var/www/html
      - ${PATH_JENKINS_TMP}:/jenkins_tmp
      - ${EXTRA_PATH}:/extra

      # for python
      - ${PYTHON_APP}:/usr/src/app:rw # Mount your application code

    links:
      - web
      - db
    ports:
      - ${JENKINS_PORTS} # 8081:8080
      - ${JENKINS_PORTS_COMMUNICATION} # 50000:50000 # Jenkins default port for communication

    environment:
      - JENKINS_HOME=/var/jenkins_home
      - JAVA_OPTS=-Dhudson.footerURL=http://dev_connectors.eol.org -Djava.io.tmpdir=/jenkins_tmp

      # for python:
      - NEO_URI=${NEO_URI}
      - NEO_USERNAME=${NEO_USERNAME}
      - NEO_PASSWORD=${NEO_PASSWORD}
      - NEO_DATABASE=${NEO_DATABASE}

